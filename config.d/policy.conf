# Grntly Brewer — uitrolbeleid (rollout policy)
# ---------------------------------------------------------------------------
# Eén plek die vastlegt wat er standaard gebeurt en wat wordt afgedwongen.
# Waarden: yes / no. De installer leest dit: het bepaalt de default-antwoorden
# in de wizard en welke security-controls worden toegepast en gecontroleerd.
# ---------------------------------------------------------------------------

# --- Accounts ---------------------------------------------------------------
CREATE_ADMIN=yes          # lokaal adminaccount aanmaken (default-antwoord)
CREATE_USER=yes           # gewone gebruiker aanmaken (default-antwoord)

# --- Security (welke controls worden afgedwongen en gecontroleerd) ----------
ENFORCE_FILEVAULT=yes     # schijfversleuteling
ENFORCE_FIREWALL=yes      # application firewall + stealth
ENFORCE_GATEKEEPER=yes    # Gatekeeper aan
ENFORCE_AUTOUPDATES=yes   # automatische (security-)updates
ENFORCE_SCREENLOCK=yes    # wachtwoord bij ontwaken/screensaver

# --- Remote beheer (SSH via Tailscale) --------------------------------------
ENABLE_REMOTE=yes         # Remote Login + Tailscale instellen (default-antwoord)
